name: Drain job queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: drain-jobs
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call job runner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRAIN_URL: ${{ secrets.DRAIN_URL }}
        run: |
          set -e
          curl --fail-with-body \
               --silent --show-error \
               --max-time 60 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X POST \
               "$DRAIN_URL/api/jobs/run"
